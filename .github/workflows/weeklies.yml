name: Weekly workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0" # Weekly at 6PM PST, 9PM EST, 3AM CET on Sunday to avoid working hours

jobs:
  build-and-upload-docker-image-rclone-with-config:
    uses: ./.github/workflows/build_and_upload_docker_image_rclone_with_config.yml
    secrets:
      DOCKER_UPLOADER_USERNAME: ${{ secrets.DOCKER_UPLOADER_USERNAME }}
      DOCKER_UPLOADER_PASSWORD: ${{ secrets.DOCKER_UPLOADER_PASSWORD }}

  notify-build-and-upload-docker-image-rclone-with-config:
    runs-on: ubuntu-latest
    needs: [build-and-upload-docker-image-rclone-with-config]
    if: ${{ always() && needs.build-and-upload-docker-image-rclone-with-config.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: NeuroConv Weekly Docker Image Build and Upload Failure
          to: ${{ secrets.DAILY_FAILURE_EMAIL_LIST }}
          from: NeuroConv
          body: "The weekly build and upload of the Docker image failed, please check status at https://github.com/catalystneuro/neuroconv/actions/workflows/weeklies.yml"

  run-weekly-rclone-docker-testing:
    needs: [build-and-upload-docker-image-rclone-with-config]  # Test the image this run just pushed
    uses: ./.github/workflows/rclone_docker_testing.yml
    secrets:
      RCLONE_DRIVE_ACCESS_TOKEN: ${{ secrets.RCLONE_DRIVE_ACCESS_TOKEN }}
      RCLONE_DRIVE_REFRESH_TOKEN: ${{ secrets.RCLONE_DRIVE_REFRESH_TOKEN }}
      RCLONE_EXPIRY_TOKEN: ${{ secrets.RCLONE_EXPIRY_TOKEN }}

  notify-rclone-docker-test-failure:
    runs-on: ubuntu-latest
    needs: [run-weekly-rclone-docker-testing]
    if: ${{ always() && needs.run-weekly-rclone-docker-testing.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: NeuroConv Weekly Rclone Docker Test Failure
          to: ${{ secrets.DAILY_FAILURE_EMAIL_LIST }}
          from: NeuroConv
          body: "The weekly rclone docker test workflow failed, please check status at https://github.com/catalystneuro/neuroconv/actions/workflows/weeklies.yml"

  run-weekly-neuroconv-docker-testing:
    uses: ./.github/workflows/neuroconv_docker_testing.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}

  notify-neuroconv-docker-test-failure:
    runs-on: ubuntu-latest
    needs: [run-weekly-neuroconv-docker-testing]
    if: ${{ always() && needs.run-weekly-neuroconv-docker-testing.result == 'failure' }}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: NeuroConv Weekly NeuroConv Docker Test Failure
          to: ${{ secrets.DAILY_FAILURE_EMAIL_LIST }}
          from: NeuroConv
          body: "The weekly neuroconv docker test workflow failed, please check status at https://github.com/catalystneuro/neuroconv/actions/workflows/weeklies.yml"
