name: Deploy tests

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    # Synchronize, open and reopened are the default types for pull request
    # We add ready_for_review to trigger the check for changelog and full tests when ready for review is clicked
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load_python_and_os_versions:
    runs-on: ubuntu-latest
    outputs:
      ALL_PYTHON_VERSIONS: ${{ steps.load_python_versions.outputs.python_versions }}
      MIN_PYTHON_VERSION: ${{ steps.load_python_versions.outputs.min_python_version }}
      MAX_PYTHON_VERSION: ${{ steps.load_python_versions.outputs.max_python_version }}
      ALL_OS_VERSIONS: ${{ steps.load_os_versions.outputs.os_versions }}
    steps:
      - uses: actions/checkout@v6
      - id: load_python_versions
        run: |
          MINIMUM=$(cat ./.github/workflows/min_python_version.txt)
          MAXIMUM=$(cat ./.github/workflows/max_python_version.txt)
          echo "min_python_version=$MINIMUM" >> "$GITHUB_OUTPUT"
          echo "max_python_version=$MAXIMUM" >> "$GITHUB_OUTPUT"
          echo "python_versions=[\"$MINIMUM\", \"$MAXIMUM\"]" >> "$GITHUB_OUTPUT"
      - id: load_os_versions
        run: echo "os_versions=$(cat ./.github/workflows/all_os_versions.txt)" >> "$GITHUB_OUTPUT"
      - name: Debugging
        run: |
          echo "Loaded Python versions: ${{ steps.load_python_versions.outputs.python_versions }}"
          echo "Loaded OS versions: ${{ steps.load_os_versions.outputs.os_versions }}"

  assess-file-changes:
    uses: ./.github/workflows/assess-file-changes.yml

  detect-changelog-updates:
    needs: assess-file-changes
    if: ${{ needs.assess-file-changes.outputs.SOURCE_CHANGED == 'true' && github.event.pull_request.draft == false }}
    name: Auto-detecting CHANGELOG.md updates
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.assess-file-changes.outputs.CHANGELOG_UPDATED == 'true' }}
        run: echo "CHANGELOG.md has been updated."
      - if: ${{ needs.assess-file-changes.outputs.CHANGELOG_UPDATED == 'false' }}
        run: |
          echo "::error::This pull request changes source files but does not update CHANGELOG.md. Add an entry under the upcoming version's section, or say in the pull request why the change needs none."
          exit 1

  run-tests:
    needs: [assess-file-changes, load_python_and_os_versions]
    if: ${{ needs.assess-file-changes.outputs.SOURCE_CHANGED == 'true' }}
    uses: ./.github/workflows/testing.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:  #  Ternary operator: condition && value_if_true || value_if_false
      python-versions: ${{ github.event.pull_request.draft == true && format('["{0}"]', needs.load_python_and_os_versions.outputs.MIN_PYTHON_VERSION) || needs.load_python_and_os_versions.outputs.ALL_PYTHON_VERSIONS }}
      os-versions: ${{ github.event.pull_request.draft == true && '["ubuntu-latest"]' || needs.load_python_and_os_versions.outputs.ALL_OS_VERSIONS }}

  # If the conversion gallery is the only thing that changed, run doctests only
  run-doctests-only:
    needs: [assess-file-changes, load_python_and_os_versions]
    if: ${{ needs.assess-file-changes.outputs.CONVERSION_GALLERY_CHANGED == 'true' && needs.assess-file-changes.outputs.SOURCE_CHANGED != 'true' }}
    uses: ./.github/workflows/doctests.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}
    with:  #  Ternary operator: condition && value_if_true || value_if_false
      python-versions: ${{ github.event.pull_request.draft == true && format('["{0}"]', needs.load_python_and_os_versions.outputs.MIN_PYTHON_VERSION) || needs.load_python_and_os_versions.outputs.ALL_PYTHON_VERSIONS }}
      os-versions: ${{ github.event.pull_request.draft == true && '["ubuntu-latest"]' || needs.load_python_and_os_versions.outputs.ALL_OS_VERSIONS }}


  run-live-service-tests:
    needs: [assess-file-changes, load_python_and_os_versions]
    if: ${{ needs.assess-file-changes.outputs.SOURCE_CHANGED == 'true' }}
    uses: ./.github/workflows/live-service-testing.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}
      DANDI_SANDBOX_API_KEY: ${{ secrets.DANDI_SANDBOX_API_KEY }}
      EMBER_SANDBOX_API_KEY: ${{ secrets.EMBER_SANDBOX_API_KEY }}
    with:  #  Ternary operator: condition && value_if_true || value_if_false
      # These test network behavior against the DANDI, EMBER and Globus sandboxes rather than anything
      # platform-specific, so a pull request runs every OS on the newest Python only; the dev dailies
      # still run the full matrix nightly.
      python-versions: ${{ format('["{0}"]', needs.load_python_and_os_versions.outputs.MAX_PYTHON_VERSION) }}
      os-versions: ${{ github.event.pull_request.draft == true && '["ubuntu-latest"]' || needs.load_python_and_os_versions.outputs.ALL_OS_VERSIONS }}


  # A gallery page names the extra it needs, and `pyproject.toml` declares that extra, so either side
  # changing can leave a page installing nothing. That is silent until the page imports something, so it
  # is checked here rather than waiting for the daily.
  run-formatwise-installation-tests:
    needs: assess-file-changes
    if: ${{ needs.assess-file-changes.outputs.CONVERSION_GALLERY_CHANGED == 'true' || needs.assess-file-changes.outputs.PYPROJECT_CHANGED == 'true' }}
    uses: ./.github/workflows/formatwise-installation-testing.yml
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_GIN_BUCKET: ${{ secrets.S3_GIN_BUCKET }}


  check-final-status:
    name: All tests passing
    if: always()
    needs:
      - run-tests
      - run-doctests-only
      - run-formatwise-installation-tests
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all jobs succeeded or at least one failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: run-tests, run-doctests-only, run-formatwise-installation-tests
          jobs: ${{ toJSON(needs) }}
