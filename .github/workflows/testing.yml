name: Minimal and Full Tests

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'List of Python versions to use in matrix, as JSON string'
        required: true
        type: string
      os-versions:
        description: 'List of OS versions to use in matrix, as JSON string'
        required: true
        type: string

    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      S3_GIN_BUCKET:
        required: true
      CODECOV_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      python-versions:
        description: 'List of Python versions to use in matrix, as JSON string'
        required: true
        type: string
      os-versions:
        description: 'List of OS versions to use in matrix, as JSON string'
        required: true
        type: string

jobs:
  run:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
        os: ${{ fromJson(inputs.os-versions) }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          # No cross-run cache: the isolated-extras steps below are here to prove each group installs from
          # scratch, and a wheel served from a cache GitHub restored is not a download that happened today.
          enable-cache: false

      - name: Install NeuroConv with minimal requirements
        run: uv pip install --system "."
      - name: Test initial import of all non-lazy dependencies
        run: |  # This tests that everything can be imported without errors
          python -c "import neuroconv"
          python -c "import neuroconv.datainterfaces"
          python -c "import neuroconv.tools"
          python -c "import neuroconv.utils"
          python -c "import neuroconv.converters"


      - name: Install NeuroConv with testing requirements
        run: |
          uv pip install --system "."
          uv pip install --system --group test
      - name: Run import tests
        run: |
          pytest tests/imports.py::TestImportStructure::test_top_level
          pytest tests/imports.py::TestImportStructure::test_tools
          pytest tests/imports.py::TestImportStructure::test_datainterfaces
          pytest tests/imports.py::test_datainterfaces_import

      - name: Run minimal tests
        run: pytest tests/test_minimal -vv -rsx -n logical --dist loadscope

      - name: Test ecephys machinery
        shell: bash
        run: |
          # Create ecephys environment
          uv venv env_ecephys
          # Activate ecephys environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_ecephys/Scripts/activate
          else
            source env_ecephys/bin/activate
          fi
          uv pip install ".[ecephys_minimal]"
          uv pip install --group test --group sorting_analyzer # we test the sorting analyzer here so we need its dependencies
          python -m pytest tests/test_modalities/test_ecephys -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Test ophys machinery
        shell: bash
        run: |
          # Create ophys environment
          uv venv env_ophys
          # Activate ophys environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_ophys/Scripts/activate
          else
            source env_ophys/bin/activate
          fi
          uv pip install ".[ophys_minimal]"
          uv pip install --group test
          python -m pytest tests/test_modalities/test_ophys -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Test fiber photometry machinery
        shell: bash
        run: |
          # Create fiber_photometry environment
          uv venv env_fiber_photometry
          # Activate fiber_photometry environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_fiber_photometry/Scripts/activate
          else
            source env_fiber_photometry/bin/activate
          fi
          uv pip install ".[fiber_photometry_minimal]"
          uv pip install --group test
          python -m pytest tests/test_modalities/test_fiber_photometry -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Test guppy machinery
        shell: bash
        run: |
          # Create guppy environment
          uv venv env_guppy
          # Activate guppy environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_guppy/Scripts/activate
          else
            source env_guppy/bin/activate
          fi
          uv pip install ".[guppy]"
          uv pip install --group test
          python -m pytest tests/test_modalities/test_guppy -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Test behavior machinery
        shell: bash
        run: |
          # Create behavior environment
          uv venv env_behavior
          # Activate behavior environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_behavior/Scripts/activate
          else
            source env_behavior/bin/activate
          fi
          uv pip install ".[behavior]"
          uv pip install --group test
          python -m pytest tests/test_modalities/test_behavior -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Test events machinery
        shell: bash
        run: |
          # Create events environment
          uv venv env_events
          # Activate events environment and install requirements
          if [ "${{ runner.os }}" == "Windows" ]; then
            . env_events/Scripts/activate
          else
            source env_events/bin/activate
          fi
          uv pip install ".[events]"
          uv pip install --group test
          python -m pytest tests/test_modalities/test_events -vv -rsx -n logical --dist loadscope
          deactivate

      - name: Prepare data for tests
        uses: ./.github/actions/load-data
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          s3-gin-bucket: ${{ secrets.S3_GIN_BUCKET }}

      - name: Install full requirements in base environment
        run: |
          uv pip install --system ".[full]"
          uv pip install --system --group sorting_analyzer

      - name: Install Wine (For Plexon2 Data Tests)
        uses: ./.github/actions/install-wine
        with:
          os: ${{ runner.os }}

      - name: Run full pytest
        # Ternary operator: only the job that uploads to Codecov below pays for coverage instrumentation
        run: pytest -vv -rsx -n logical --dist loadscope ${{ (matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest') && '--cov=neuroconv --cov-report xml:./codecov.xml' || '' }}
      - name: Upload full coverage to Codecov
        if: ${{ matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./codecov.xml
          flags: unittests
          name: codecov-umbrella
          codecov_yml_path: ./codecov.yml
          fail_ci_if_error: true
          verbose: true
