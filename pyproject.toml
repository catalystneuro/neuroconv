[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
# The `--numprocesses` is not only for speed: `PYTHONWARNDEFAULTENCODING` (set below) reaches the interpreter only through
# the xdist workers, which start after `pytest-env` has written it, so a serial run cannot see `EncodingWarning`.
addopts = "-ra --doctest-glob='*.rst' --numprocesses=logical --dist=loadscope"
testpaths = ["docs/conversion_examples_gallery/", "tests"]
doctest_optionflags = "ELLIPSIS"
filterwarnings = [
    "ignore:Date is missing timezone information. Updating to local timezone.:UserWarning:pynwb.file",
    "ignore:.*compression may not be available.*:UserWarning:hdmf.container",  # We test compression in the tests, so we ignore this warning
    "error:Importing classes at __init__ has been deprecated in favor of only importing function-size wrappers and will be removed in 0.105.0.*:UserWarning:spikeinterface.extractors",  # TODO: remove when spikeinterface>=0.105.0
    # `num_samples` is a computed property on pynwb's `TimeSeries` (it returns `len(data)`), so the signed int it
    # hands hdmf for an unsigned spec is not something a caller can influence.
    "ignore:Spec .*num_samples.*is being converted:hdmf.build.warnings.DtypeConversionWarning",
    # pymatreader reports every MATLAB class object it meets, and CellExplorer session files are full
    # of them. The reader imports what it can and nothing in NeuroConv can change what the file holds.
    "ignore:Complex objects \\(like classes\\) are not supported:UserWarning:pymatreader.utils",
    # `PYTHONWARNDEFAULTENCODING` (set below) enables `EncodingWarning` process wide, so every dependency that opens
    # a text file without `encoding=` reports one. Only our own calls are actionable, so ignore the category by
    # default and re-raise it as an error for the code we own. Later filters take precedence, so the two `error`
    # entries must stay after the `ignore`.
    "ignore::EncodingWarning",
    "error::EncodingWarning:neuroconv",  # Require explicit encoding= in all open() calls per PEP 597
    "error::EncodingWarning:tests",
]

[tool.pytest_env]
PYTHONWARNDEFAULTENCODING = "1"  # Emit EncodingWarning when open() lacks explicit encoding (PEP 597)

[tool.black]
line-length = 120
target-version = ['py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.yml
  |\.txt
  |\.sh
  |\.git
  |\.ini
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''


[tool.ruff]
# Kept equivalent to [tool.black] above, so that running ruff directly does not rewrap what black
# formatted. Ruff's default line length is 88, and its default exclusions already cover the ones black
# lists, so the width is the only setting that has to be restated.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F401",  # Unused import
    "I",  # All isort rules
    "D101",  # Missing docstring in public class
    "D103",  # Missing docstring in public function
    "UP006", # non-pep585 annotation (tuple, list -> tuple, list)
    "UP007" # non-pep604 annotation (Union[x, y] -> X | Y )
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**__init__.py" = ["F401", "I"]
"tests/**" = ["D"] # We are not enforcing docstrings in tests
"src/neuroconv/tools/testing/data_interface_mixins.py" = ["D"]  # We are not enforcing docstrings in the interface mixings
"docs/conf.py" = ["D"]  # We are not enforcing docstrings in the conf.py file
"docs/conversion_examples_gallery/conftest.py" = ["D"]  # We are not enforcing docstrings in the conversion examples

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["neuroconv"]


[tool.codespell]
skip = '.git*,*.pdf,*.css,*.svg'
check-hidden = true
ignore-words-list = 'assertin,sortings,Tye,trough'

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-env",  # Set environment variables in pyproject.toml for pytest
    "parameterized>=0.8.1",
    "pytest-xdist"  # Runs tests on parallel
]
sorting_analyzer = [   # These dependencies are for testing the sorting analyzer tool
    "scipy",
    "numba; sys_platform != 'darwin' or platform_machine != 'x86_64'"
]

docs = [
    "Sphinx==8.2.3; python_version>='3.11'",  # Latest as of April 2025.
    "readthedocs-sphinx-search==0.1.2",  # Deprecated, probably should be removed see https://github.com/readthedocs/readthedocs-sphinx-search/issues/144
    "sphinx-toggleprompt==0.6.0",  # Latest as of April 2025.
    "sphinx-copybutton==0.5.2",  # Latest as of April 2025.
    "sphinx-design==0.7.0; python_version>='3.11'",  # Used by metadata_templates.rst to show the YAML and JSON forms of each template in tabs.
    "pydata_sphinx_theme==0.16.1",  # Latest as of April 2025.
    "roiextractors",  # Needed for the API documentation
    "spikeinterface>=0.104.7",  # Needed for the API documentation
    "pytest" # used to build the documentation for tools.testing
]

dev = [
    "pre-commit",
    {include-group = "test"},
]
