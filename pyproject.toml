## Ophys
ophys_minimal = [  # Keeps the minimal version of ophys dependencies in the repo
    "roiextractors>=0.9.0",
]
# What it takes to read a tiff, stated once for the formats that are stored as one. Membership is by
# what the format reads and not by modality, so Inscopix (.isxd) and Miniscope (video) are not here.
ophys_tiff = [
    "neuroconv[ophys_minimal]",
    # The 'codecs' extra pulls 'imagecodecs' (~49 MB), which tifffile needs to decode a compressed
    # tiff; without it a compressed file raises "<COMPRESSION.LZW: 5> requires the 'imagecodecs'
    # package" from six frames inside tifffile, mid-read, reading as though the file were corrupt.
    # Compression is a property of the file a user was handed rather than a choice they made, so
    # they cannot know to install it in advance, which is why it is declared rather than left out.
    # This is meant to be temporary: remove it once roiextractors detects the compression at
    # construction time and raises a message naming 'imagecodecs' and saying the file is not corrupt.
    # At that point the minority who need it can install it on a clear instruction, and the majority
    # stop paying for it.
    "tifffile[codecs]>=2023.3.21",
]
brukertiff = [
    "neuroconv[ophys_tiff]",
    "natsort",
]
