    # working, at the cost of every calcium imaging install carrying tdt, ndx-guppy, tables and h5py.
    # No documentation has ever pointed at this path, every photometry gallery page installs the
    # single format extra it needs, so removing it should reach very few people.
    "neuroconv[fiber_photometry]",
