[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"


[project]
name = "neuroconv"
version = "0.10.1.dev0"
description = "Convert data from proprietary formats to NWB format."
readme = "README.md"
authors = [
    { name = "Cody Baker" },
    { name = "Szonja Weigl" },
    { name = "Heberto Mayorquin" },
    { name = "Paul Adkisson-Floro" },
    { name = "Luiz Tauffer" },
    { name=  "Alessandra Trapani" },
    { name = "Ben Dichter", email = "ben.dichter@catalystneuro.com" },
]


license = { file = "license.txt" }
keywords = ["nwb", "NeurodataWithoutBorders"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "License :: OSI Approved :: BSD License",

]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0; python_version <= '3.11'",
    "numpy>=1.26.0; python_version >= '3.12'",
    "PyYAML>=5.4",
    "h5py>=3.9.0",
    "hdmf>=6.1.0",
    "hdmf_zarr>=0.11",
    "pynwb>=4.0.0",
    "pydantic>=2.0",
    "typing_extensions>=4.1.0",
    "psutil>=5.8.0",
    "tqdm>=4.60.0",
    "pandas",
    "parse>=1.20.0",  # For the path expansion functionality
    "click",  # for CLI access point in the yaml conversion specificatio
    "jsonschema>=3.2.0",
    "docstring-parser",  # For building json schema from method signatures
    "packaging",  # Issue 903
    "referencing", # for the json schema references
    "numcodecs<0.16.0", # 0.16.0 is incompatible with zarr < 3: https://github.com/zarr-developers/numcodecs/issues/721
]


[project.urls]
"Homepage" = "https://github.com/catalystneuro/neuroconv"
"Documentation" = "https://neuroconv.readthedocs.io/"
"Changelog" = "https://github.com/catalystneuro/neuroconv/blob/main/CHANGELOG.md"


[project.scripts]
neuroconv = "neuroconv.tools.yaml_conversion_specification._yaml_conversion_specification:run_conversion_from_yaml_cli"

[project.optional-dependencies]
dandi = ["dandi>=0.70.0"]
compressors = ["hdf5plugin"]
aws = ["boto3"]

##########################
# Modality-specific Extras
##########################

## Text
csv = [
]
excel = [
    "openpyxl",
    "xlrd",
]
text = [
    "neuroconv[csv]",
    "neuroconv[excel]",
]

## Behavior
audio = [
    "ndx-sound>=0.2.3",  # 0.2.3 fixes the starting_time dtype so the spec resolves under hdmf>=6
    "scipy", # for scipy.io.wavfile
]
sleap = [
    "av>=10.0.0",
    "sleap-io>=0.5.2",
    "ndx-pose>=0.2.2",
]
deeplabcut = [
    "ndx-pose>=0.2",
    "tables; platform_system != 'Darwin'",
    "tables>=3.10.1; platform_system == 'Darwin' and python_version >= '3.10'",
]
fictrac = [
]
video = [
    # Remove this pin when the following issue is resolved: https://github.com/opencv/opencv-python/issues/1192
    "opencv-python-headless>=4.8.1.78,<4.13; platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.8.1.78; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]
lightningpose = [
    "ndx-pose>=0.2",
    "neuroconv[video]",
]
medpc = [
    # MedPC events are parsed from a raw text file and written as native pynwb 4.0 EventsTable objects, so this
    # needs nothing beyond core; kept as a stable install alias so `neuroconv[medpc]` remains valid.
]
medpc_legacy = [
    "ndx-events==0.2.2",  # only the deprecated MedPCInterface writes ndx-events; both go in v0.12.0
]
vame = [
    "ndx-vame>=0.3.2",
    "ndx-ethogram>=0.1.0",  # For the curated EthogramBouts/Ethogram derived from MotifSeries
]
behavior = [
    "neuroconv[sleap]",
    "neuroconv[audio]",
    "neuroconv[deeplabcut]",
    "neuroconv[fictrac]",
    "neuroconv[video]",
    "neuroconv[lightningpose]",
    # TODO: drop this when MedPCInterface is removed in v0.12.0; the events interfaces are in
    # neuroconv[events] and the legacy extra exists only for that interface's ndx-events pin.
    "neuroconv[medpc_legacy]",
    "neuroconv[vame]",
    "ndx-miniscope>=0.5.1",  # This is for the miniscope behavior data interface, not sure is needed
]

## Events
csv_events = [
    # CSV events now write native pynwb 4.0 EventsTable objects and need only core pandas + pynwb>=4.0;
    # kept as a stable install alias so `neuroconv[csv_events]` and `neuroconv[events]` remain valid.
]
npm_events = [
    # NPM events are a headerless CSV written as native pynwb 4.0 EventsTable objects (via CSVEventsInterface),
    # so they need only core pandas + pynwb>=4.0; kept as a stable install alias so `neuroconv[npm_events]`
    # and `neuroconv[events]` remain valid.
]
tdt_events = [
    "tdt",  # raw TDT tank reader; listed directly to avoid pulling in spikeinterface/neo via neuroconv[tdt]
]
doric_events = [
    "h5py>=3",  # Doric events live in the .doric HDF5 file; the CSV export variant needs only pandas.
]
pyphotometry_events = [
    # A .ppd is read by neuroconv's own binary reader and written as native pynwb 4.0 EventsTable objects,
    # so this needs only core numpy + pynwb>=4.0; kept as a stable install alias so
    # `neuroconv[pyphotometry_events]` and `neuroconv[events]` remain valid.
]
events = [
    "neuroconv[csv_events]",
    "neuroconv[doric_events]",
    "neuroconv[medpc]",
    "neuroconv[npm_events]",
    "neuroconv[pyphotometry_events]",
    "neuroconv[tdt_events]",
]


